name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go_scraper/go.sum

      - name: Vet
        working-directory: ./go_scraper
        run: go vet ./...

      - name: Build (compile check only — binary not uploaded)
        working-directory: ./go_scraper
        run: go build -o /dev/null .

      - name: Test
        working-directory: ./go_scraper
        run: go test ./... -v -timeout 30s
