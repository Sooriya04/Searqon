name: CI & Docker Release Pipeline

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/go.sum

      - name: Verify Go Modules
        working-directory: ./src
        run: go mod verify

      - name: Run Go Vet
        working-directory: ./src
        run: go vet ./...

      - name: Run All Tests
        working-directory: ./src
        run: go test ./... -v -timeout 120s

      - name: Build Binary Check
        working-directory: ./src
        run: go build -v -o ../bin/searqon .

  publish-docker:
    name: Build & Push to Docker Hub
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Version in Commit Message or Tag
        id: check-version
        run: |
          MSG="${{ github.event.head_commit.message }}"
          REF="${{ github.ref_name }}"
          
          echo "Commit message: $MSG"
          echo "Git ref: $REF"
          
          VER=""
          # 1. Check if git ref is a version tag (e.g. v1.0.0 or 1.0.0)
          if [[ "$REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VER=$(echo "$REF" | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed -E 's/^v//')
          # 2. Check if commit message contains a semantic version (e.g. v1.0.0, 1.0.0, release: v1.0.0)
          elif echo "$MSG" | grep -Eq 'v?[0-9]+\.[0-9]+\.[0-9]+'; then
            VER=$(echo "$MSG" | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed -E 's/^v//')
          fi

          if [ -n "$VER" ]; then
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "tags=sooriya04/searqon:${VER},sooriya04/searqon:v${VER},sooriya04/searqon:latest" >> "$GITHUB_OUTPUT"
            echo "✓ Version detected: ${VER}. Proceeding with Docker Hub publish."
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            echo "ℹ No version found in commit message or tag. Skipping Docker Hub publish."
          fi

      - name: Set up Docker Buildx
        if: steps.check-version.outputs.has_version == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check-version.outputs.has_version == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Release Image (scratch)
        if: steps.check-version.outputs.has_version == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.check-version.outputs.tags }}

      - name: Update Docker Hub Description via API
        if: steps.check-version.outputs.has_version == 'true'
        run: |
          # Authenticate with Docker Hub to get a JWT
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${{ secrets.DOCKERHUB_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            "https://hub.docker.com/v2/users/login" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

          if [ -z "$TOKEN" ]; then
            echo "⚠ Could not authenticate with Docker Hub — skipping description update."
            exit 0
          fi

          DESCRIPTION=$(cat ./docs/docker.md)

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"full_description\": $(echo "$DESCRIPTION" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
            "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/searqon/")

          if [ "$STATUS" = "200" ]; then
            echo "✓ Docker Hub description updated successfully."
          else
            echo "⚠ Docker Hub description update returned HTTP $STATUS — skipping (non-fatal)."
          fi
