name: CI & Docker Release Pipeline

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: src/go.sum

      - name: Verify Go Modules
        working-directory: ./src
        run: go mod verify

      - name: Run Go Vet
        working-directory: ./src
        run: go vet ./...

      - name: Run All Tests
        working-directory: ./src
        run: go test ./... -v -timeout 120s

      - name: Build Binary Check
        working-directory: ./src
        run: go build -v -o ../bin/searqon .

  publish-docker:
    name: Build & Push to Docker Hub
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Version in Commit Message or Tag
        id: check-version
        run: |
          MSG="${{ github.event.head_commit.message }}"
          REF="${{ github.ref_name }}"
          
          echo "Commit message: $MSG"
          echo "Git ref: $REF"
          
          VER=""
          # 1. Check if git ref is a version tag (e.g. v1.0.0 or 1.0.0)
          if [[ "$REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VER=$(echo "$REF" | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed -E 's/^v//')
          # 2. Check if commit message contains a semantic version (e.g. v1.0.0, 1.0.0, release: v1.0.0)
          elif echo "$MSG" | grep -Eq 'v?[0-9]+\.[0-9]+\.[0-9]+'; then
            VER=$(echo "$MSG" | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | sed -E 's/^v//')
          fi

          if [ -n "$VER" ]; then
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "tags=sooriya04/searqon:${VER},sooriya04/searqon:v${VER},sooriya04/searqon:latest" >> "$GITHUB_OUTPUT"
            echo "✓ Version detected: ${VER}. Proceeding with Docker Hub publish."
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            echo "ℹ No version found in commit message or tag. Skipping Docker Hub publish."
          fi

      - name: Set up Docker Buildx
        if: steps.check-version.outputs.has_version == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check-version.outputs.has_version == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Release Image (scratch)
        if: steps.check-version.outputs.has_version == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.check-version.outputs.tags }}

      - name: Update Docker Hub Description via API
        if: steps.check-version.outputs.has_version == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error, sys

          username = os.environ["DOCKERHUB_USERNAME"]
          token    = os.environ["DOCKERHUB_TOKEN"]

          # Step 1: Authenticate and get JWT
          login_data = json.dumps({"username": username, "password": token}).encode()
          req = urllib.request.Request(
              "https://hub.docker.com/v2/users/login",
              data=login_data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  jwt = json.loads(resp.read())["token"]
                  print("Authenticated with Docker Hub successfully.")
          except Exception as e:
              print(f"Warning: Docker Hub login failed: {e} - skipping description update.")
              sys.exit(0)

          # Step 2: Read docs/docker.md
          with open("./docs/docker.md", "r") as f:
              full_description = f.read()

          # Step 3: PATCH repository short description + full README
          short_desc = "Self-hosted Web Intelligence Engine for AI Agents. Search, Anti-Bot Scraping & MCP Server."
          patch_data = json.dumps({
              "description": short_desc,
              "full_description": full_description
          }).encode()

          req2 = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/{username}/searqon/",
              data=patch_data,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {jwt}"
              },
              method="PATCH"
          )
          try:
              with urllib.request.urlopen(req2) as resp:
                  print(f"Docker Hub description updated successfully (HTTP {resp.status}).")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Warning: Docker Hub description update failed HTTP {e.code}: {body}")
          PYEOF
