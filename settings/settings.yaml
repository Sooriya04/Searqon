# Searqon Scraper Settings

browser:
  headless: "new"
  window_size: "1920,1080"
  timeout: 15000

concurrency:
  max_active_sessions: 20
  queue_limit: 50

scraping:
  block_resources: ["image", "stylesheet", "font", "media"]
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36 Searqon/1.0"

providers:
  talven: true
  node_rerank: true
  python_rerank: false
