    <rect x="16" y="14" width="76" height="22" rx="6" fill="#0369a1" />
    <text x="54" y="29" text-anchor="middle" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">TIER 2</text>
    <text x="102" y="30" fill="#f0f9ff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Anti-Bot Spoofed Headers &amp; TLS 1.3</text>
    <text x="20" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Coherent Browser Personas: Chrome 128 (Win11/macOS), Safari 17.6</text>
    <text x="20" y="76" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Exact Client Hints: Sec-CH-UA, Sec-CH-UA-Platform, Sec-Fetch-*</text>
    <text x="20" y="94" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Search Referer Spoofing (Google, DuckDuckGo, Bing) &amp; Modern Ciphers</text>
    <text x="20" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Timeout: 4000ms | Bypasses 80% of lightweight bot filters</text>
  </g>

