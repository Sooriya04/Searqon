    <text x="20" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• <tspan fill="#a78bfa" font-weight="600">Camoufox:</tspan> C++ stealth anti-detect Firefox (Turnstile / DataDome)</text>
