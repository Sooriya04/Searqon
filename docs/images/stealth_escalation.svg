  <rect x="580" y="400" width="120" height="18" rx="4" fill="#064e3b" />
  <text x="640" y="413" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Challenge Bypassed</text>

