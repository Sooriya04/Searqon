    <circle cx="90" cy="42" r="18" fill="#10b981" fill-opacity="0.3" />
    <path d="M83 42l5 5 10-10" fill="none" stroke="#ecfdf5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="90" y="78" text-anchor="middle" fill="#f0fdf4" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Extracted Payload</text>
    <text x="90" y="98" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Clean Markdown</text>
    <text x="90" y="114" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Semantic Chunks</text>
    <text x="90" y="130" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Metadata &amp; Tables</text>
    <text x="90" y="146" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Structured JSON</text>
    <rect x="20" y="156" width="140" height="16" rx="4" fill="#064e3b" />
    <text x="90" y="168" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Saved to Cache (7-Day TTL)</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(120, 850)">
    <rect width="790" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="21" r="5" fill="#34d399" />
    <text x="40" y="25" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Success Route</text>

    <circle cx="160" cy="21" r="5" fill="#f87171" />
    <text x="172" y="25" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Escalation Trigger (WAF / Bot challenge detected)</text>

    <text x="560" y="25" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Override with <tspan fill="#38bdf8" font-family="monospace">stealth_level: &quot;auto&quot;|&quot;fast_http&quot;|&quot;browser&quot;|&quot;proxy&quot;</tspan></text>
  </g>
</svg>
