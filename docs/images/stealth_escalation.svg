  <!-- Header Title -->
  <g transform="translate(480, 48)">
    <text text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em">
      Searqon — Smart Stealth &amp; Anti-Bot Escalation Ladder
    </text>
    <text y="24" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
      Multi-Tier Chained Fallback Pipeline: Fast HTTP → Spoofed Headers → Headless Browser → Residential Proxy
    </text>
  </g>

  <!-- Dispatcher Node -->
  <g transform="translate(180, 100)" filter="url(#card-shadow)">
    <rect width="320" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <circle cx="28" cy="30" r="14" fill="#3b82f6" fill-opacity="0.2" />
    <path d="M22 30h12M28 24v12" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
    <text x="56" y="28" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Inbound Scrape Dispatch</text>
    <text x="56" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">URL &amp; Domain Politeness Rate Limiter</text>
  </g>

  <!-- Downward Line 0 -->
  <path d="M340 160 v32" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-down)" />

  <!-- ================= TIER 1 ================= -->
  <g transform="translate(120, 195)" filter="url(#card-shadow)">
    <rect width="440" height="112" rx="12" fill="url(#grad-tier1)" stroke="#10b981" stroke-width="1.5" />
    <rect x="16" y="14" width="76" height="22" rx="6" fill="#065f46" />
    <text x="54" y="29" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">TIER 1</text>
    <text x="102" y="30" fill="#ecfdf5" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Fast Direct HTTP (~50–150ms)</text>
    <text x="20" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Native Go HTTP client with zero proxy or subprocess overhead</text>
    <text x="20" y="78" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Standard clean HTTP headers &amp; brotli/gzip transport decompression</text>
    <text x="20" y="98" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Timeout: 2500ms | Direct Connection</text>
  </g>

  <!-- Tier 1 to Success Arrow -->
  <path d="M560 251 h160" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="580" y="235" width="120" height="18" rx="4" fill="#064e3b" />
  <text x="640" y="248" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">200 OK &amp; Unblocked</text>

  <!-- Tier 1 to Tier 2 Escalation Arrow -->
  <path d="M340 307 v45" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="250" y="318" width="180" height="18" rx="4" fill="#450a0a" />
  <text x="340" y="331" text-anchor="middle" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Blocked: 403 / 429 / 503 / WAF</text>

  <!-- ================= TIER 2 ================= -->
