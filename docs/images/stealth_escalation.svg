    <text x="20" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Timeout: 6000–8000ms | Solves dynamic JS gates</text>
  </g>

  <!-- Tier 3 to Success Arrow -->
  <path d="M560 586 h160" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="580" y="570" width="120" height="18" rx="4" fill="#064e3b" />
  <text x="640" y="583" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">DOM Hydrated &amp; Cleaned</text>

  <!-- Tier 3 to Tier 4 Escalation Arrow -->
  <path d="M340 647 v45" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="235" y="658" width="210" height="18" rx="4" fill="#450a0a" />
  <text x="340" y="671" text-anchor="middle" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">IP Blacklisted / Hard Geo-Block</text>

