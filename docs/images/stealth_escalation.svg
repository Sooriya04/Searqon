    <rect x="16" y="14" width="76" height="22" rx="6" fill="#b45309" />
    <text x="54" y="29" text-anchor="middle" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">TIER 4</text>
    <text x="102" y="30" fill="#fffbeb" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Residential Proxy Fallback</text>
    <text x="20" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Dedicated residential pool: RESIDENTIAL_PROXY_URL / proxies.txt</text>
    <text x="20" y="76" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Routes spoofed HTTP or Headless Browser through genuine ISP nodes</text>
    <text x="20" y="94" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Bypasses datacenter subnet bans and aggressive IP reputation blocks</text>
    <text x="20" y="110" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Timeout: 6000ms | ISP Residential Gateway</text>
  </g>

  <!-- Tier 4 to Success Arrow -->
  <path d="M560 754 h160" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="580" y="738" width="120" height="18" rx="4" fill="#064e3b" />
  <text x="640" y="751" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">IP Gate Bypassed</text>

