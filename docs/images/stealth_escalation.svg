  <rect x="235" y="488" width="210" height="18" rx="4" fill="#450a0a" />
  <text x="340" y="501" text-anchor="middle" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">JS Required / Cloudflare Turnstile</text>

