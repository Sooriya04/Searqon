services:
  # ── Searqon Web Intelligence Engine ─────────────────────────────────────────
  searqon:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    ports:
      - "4001:4001"
    restart: unless-stopped
    environment:
      - SEARXNG_URL=http://host.docker.internal:4002
      - DATABASE_URL=postgres://searqon:searqon_pass@searqon-db:5432/searqon_cache?sslmode=disable
    depends_on:
      - searqon-db

  # ── PostgreSQL Cache Database ───────────────────────────────────────────────
  searqon-db:
    build:
      context: ./docker/database
      dockerfile: Dockerfile
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=searqon
      - POSTGRES_PASSWORD=searqon_pass
      - POSTGRES_DB=searqon_cache
    volumes:
      - searqon-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── SearXNG (Optional, separate profile) ────────────────────────────────────
  # Run separately with: docker compose --profile searxng up
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    profiles:
      - searxng

volumes:
  searqon-db-data:
